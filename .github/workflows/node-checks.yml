name: Node checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/admin-sovereign-desk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server syntax
        run: node --check server.js
      - name: Run test suite
        run: npm test
