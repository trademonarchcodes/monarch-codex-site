<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>{{TITLE}} | Monarch Codex</title>
<style>
:root{color-scheme:dark;--gold:#f3cf3c;--bg:#0b0b0c;--panel:#17171c;--muted:#aaa7a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#292313 0,transparent 42%),#0b0b0c;color:#f7f5ef;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.desk-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;max-width:1600px;margin:auto;padding:22px;align-items:start}.desk-sidebar{display:block!important;visibility:visible!important;position:sticky;top:18px;align-self:start;width:100%;min-width:0;max-height:calc(100dvh - 36px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#8a7135 #111113;padding:16px 12px;border:1px solid #3e3624;border-radius:20px;background:linear-gradient(180deg,#191817,#101012);box-shadow:0 18px 48px #0004}.desk-brand{display:flex;align-items:center;gap:11px;padding:8px 8px 18px;border-bottom:1px solid #353025;color:#f5d675;font-weight:950;letter-spacing:.1em}.desk-mark{display:grid;place-items:center;width:40px;height:40px;border:1px solid #76602b;border-radius:13px;background:#2a2314;font-size:20px}.desk-brand small{display:block;color:#a9a18d;font-size:9px;letter-spacing:.16em;margin-top:3px}.desk-kicker{margin:20px 8px 8px;color:#8f8878;font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.desk-nav{display:grid;gap:5px}.desk-nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:#d7d2c7;text-decoration:none;font-weight:700}.desk-nav a:hover,.desk-nav a[aria-current=page]{color:#f3cf3c;background:linear-gradient(90deg,#3a3017,#252014)}.desk-nav .nav-icon{width:22px;text-align:center;font-size:18px}.desk-nav .nav-arrow{margin-left:auto;color:#8e815b}.desk-main{min-width:0}.desk-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:18px 22px;border:1px solid #393226;border-radius:17px;background:#141416}.desk-top h1{font-size:clamp(21px,3vw,30px);line-height:1.2;margin:0}.desk-top p{margin:6px 0 0;color:var(--muted);font-size:12px}.desk-role{padding:7px 10px;border:1px solid #514323;border-radius:99px;background:#292315;color:#f0d782;font-size:10px;font-weight:850;letter-spacing:.08em}.desk-content{min-width:0}.ac-panel,.ac-section-card{margin:0 0 18px;padding:clamp(17px,2.5vw,26px);border:1px solid #37332a;border-radius:17px;background:linear-gradient(145deg,#19191d,#121214)}.ac-panel h2{margin:0 0 8px;font-size:20px}.ac-panel p{color:#b9b5aa}.ac-table-wrap{overflow:auto}.ac-table{width:100%;border-collapse:collapse;min-width:580px}.ac-table th,.ac-table td{padding:11px;text-align:left;vertical-align:top;border-bottom:1px solid #34312a}.ac-table th{color:#d9c47d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.ac-panel input,.ac-panel textarea,.ac-panel select{width:100%;padding:11px;border:1px solid #44414a;border-radius:10px;background:#0d0d10;color:#f7f5ef;font:inherit;margin:5px 0 12px}.ac-panel label{display:block;font-size:12px;font-weight:750}.ac-panel .btn,.ac-panel button,.ac-panel .copy-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid #78632d;border-radius:10px;background:#f3cf3c;color:#15120a;font-weight:850;text-decoration:none;cursor:pointer}.ac-tiles,.ac-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ac-tile,.ac-stat{padding:16px;border:1px solid #39352a;border-radius:13px;background:#151518;color:#f7f5ef;text-decoration:none}.ac-tile:hover{border-color:#b69b4e}.ac-tile strong,.ac-tile small{display:block}.ac-tile small,.ac-stat small{margin-top:5px;color:#aaa7a0}.ac-stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0}.ac-stat strong{display:block;font-size:26px;color:#f3cf3c}.ac-overview-hero{display:flex;justify-content:space-between;gap:18px;padding:22px;border:1px solid #514323;border-radius:16px;background:radial-gradient(ellipse at right,#302718,transparent 60%),#171613}.ac-overview-hero h2{font-size:clamp(20px,3vw,29px);max-width:700px}.ac-hero-kicker{color:#f3cf3c!important;font-size:10px;font-weight:900;letter-spacing:.18em}.ac-hero-mark{color:#e9c55d;font-size:48px}.ac-section-head{margin:20px 0 12px}.ac-section-head h2{margin:0}.ac-actions{display:flex;gap:7px;flex-wrap:wrap}.ac-alert,.notice{padding:12px 14px;margin-bottom:14px;border:1px solid #625222;border-radius:11px;background:#27220f;color:#f1dda0}.muted,small{color:#aaa7a0}.ac-tiles form{margin:0} .desk-mobile-toggle{display:none}.desk-drawer-scrim{display:none}@media(max-width:850px){.desk-layout{display:block;padding:12px;gap:12px}.desk-mobile-toggle{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin:0 0 12px;padding:10px 13px;border:1px solid #5d4a24;border-radius:13px;background:linear-gradient(110deg,#211c10,#141416);color:#f3cf3c;font:inherit;font-weight:850;text-align:left;cursor:pointer}.desk-mobile-toggle .toggle-icon{display:grid;place-items:center;width:28px;height:28px;border:1px solid #665425;border-radius:8px;font-size:18px}.desk-sidebar{position:fixed!important;z-index:1002;left:0;top:0;bottom:0;width:min(86vw,320px)!important;max-height:100dvh!important;height:100dvh;overflow-y:auto;border-radius:0 20px 20px 0;transform:translateX(-105%);transition:transform .22s ease;padding:17px 13px;box-shadow:18px 0 45px #0008}.desk-layout.desk-menu-open .desk-sidebar{transform:translateX(0)}.desk-drawer-scrim{position:fixed;inset:0;z-index:1001;width:100%;height:100%;padding:0;border:0;background:#000b;backdrop-filter:blur(3px)}.desk-layout.desk-menu-open .desk-drawer-scrim{display:block}.desk-brand{padding-bottom:12px}.desk-kicker{margin-top:12px}.desk-nav{grid-template-columns:1fr}.desk-nav a{padding:11px 12px;font-size:13px}.desk-nav .nav-arrow{display:block}.desk-top{padding:16px}.ac-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:851px){.desk-mobile-toggle,.desk-drawer-scrim{display:none!important}}@media(max-width:440px){.desk-nav{grid-template-columns:1fr 1fr}.desk-nav a{gap:6px;padding:9px 7px}.ac-tiles{grid-template-columns:1fr}.ac-panel{padding:15px}.desk-top h1{font-size:21px}}

/* Approved responsive navigation: compact desktop rail and native-feeling mobile bottom bar. */
@media(min-width:851px){
  .desk-layout{grid-template-columns:84px minmax(0,1fr);gap:16px;padding:18px}
  .desk-sidebar{width:84px;padding:14px 8px;overflow-x:visible;z-index:20;transition:width .18s ease}
  .desk-brand{justify-content:center;padding:8px 0 16px}
  .desk-brand>span:not(.desk-mark){display:none}
  .desk-kicker{display:none}
  .desk-nav a{justify-content:center;gap:0;padding:12px 6px;min-height:46px}
  .desk-nav a>span:nth-child(2){position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .desk-nav .nav-arrow{display:none}
  .desk-sidebar:hover,.desk-sidebar:focus-within{width:252px;padding:14px 12px;box-shadow:18px 18px 42px #000b}
  .desk-sidebar:hover .desk-brand,.desk-sidebar:focus-within .desk-brand{justify-content:flex-start;padding:8px 8px 18px}
  .desk-sidebar:hover .desk-brand>span:not(.desk-mark),.desk-sidebar:focus-within .desk-brand>span:not(.desk-mark){display:block}
  .desk-sidebar:hover .desk-kicker,.desk-sidebar:focus-within .desk-kicker{display:block}
  .desk-sidebar:hover .desk-nav a,.desk-sidebar:focus-within .desk-nav a{justify-content:flex-start;gap:10px;padding:11px 12px}
  .desk-sidebar:hover .desk-nav a>span:nth-child(2),.desk-sidebar:focus-within .desk-nav a>span:nth-child(2){position:static;width:auto;height:auto;margin:0;overflow:visible;clip:auto;white-space:normal}
  .desk-sidebar:hover .desk-nav .nav-arrow,.desk-sidebar:focus-within .desk-nav .nav-arrow{display:block}
  .desk-bottom-nav{display:none!important}
}
.desk-bottom-nav{display:none}
@media(max-width:850px){
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .desk-layout{padding:10px 10px 16px}
  .desk-mobile-toggle{display:none!important}
  .desk-bottom-nav{position:fixed;z-index:1000;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #514322;background:rgba(13,13,15,.97);backdrop-filter:blur(18px);box-shadow:0 -10px 30px #0006}
  .desk-bottom-nav a,.desk-bottom-nav button{display:flex;min-width:0;min-height:52px;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;border:0;border-radius:10px;background:transparent;color:#bdb7a8;text-decoration:none;font:inherit;cursor:pointer}
  .desk-bottom-nav a[aria-current=page]{background:#302715;color:#f3cf3c}
  .desk-bottom-nav span{font-size:19px;line-height:1.1}
  .desk-bottom-nav small{font-size:10px;font-weight:800;line-height:1.2;color:inherit;white-space:nowrap}
  .desk-sidebar{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .desk-layout.desk-menu-open .desk-sidebar{width:min(86vw,320px)!important}
}
</style>
</head>
<body>
<div class="desk-layout" id="sovereignDeskLayout">
<button class="desk-mobile-toggle" id="deskMenuToggle" type="button" aria-expanded="false" aria-controls="deskSidebar"><span class="toggle-icon" aria-hidden="true">☰</span><span>THE SOVEREIGN DESK</span><span style="margin-left:auto;font-size:12px;color:#aaa7a0">Open navigation</span></button>
<button class="desk-drawer-scrim" id="deskDrawerScrim" type="button" aria-label="Close navigation"></button>
<aside class="desk-sidebar" id="deskSidebar">
<a class="desk-brand" href="/sovereign-admin" style="text-decoration:none"><span class="desk-mark">⌁</span><span>MONARCH CODEX<small>THE SOVEREIGN DESK</small></span></a>
<div class="desk-kicker">Desk workspace</div>
<nav class="desk-nav" aria-label="Sovereign Desk navigation">{{NAV}}</nav>
</aside>
<main class="desk-main">
<header class="desk-top"><div><h1>{{TITLE}}</h1><p>Signals, guidance, membership access and workspace activity.</p></div><span class="desk-role">{{ROLE}}</span></header>
<div class="desk-content">{{CONTENT}}</div>
</main>
</div>
<nav class="desk-bottom-nav" aria-label="Sovereign Desk mobile navigation">{{BOTTOM_NAV}}</nav>
<script>(function(){var layout=document.getElementById("sovereignDeskLayout"),toggle=document.getElementById("deskMenuToggle"),scrim=document.getElementById("deskDrawerScrim"),side=document.getElementById("deskSidebar"),bottomMore=document.getElementById("deskBottomMore");if(!layout||!toggle||!scrim||!side)return;function close(){layout.classList.remove("desk-menu-open");toggle.setAttribute("aria-expanded","false")}toggle.addEventListener("click",function(){var open=!layout.classList.contains("desk-menu-open");layout.classList.toggle("desk-menu-open",open);toggle.setAttribute("aria-expanded",String(open))});if(bottomMore){bottomMore.addEventListener("click",function(){var open=!layout.classList.contains("desk-menu-open");layout.classList.toggle("desk-menu-open",open);toggle.setAttribute("aria-expanded",String(open));if(open)side.scrollTop=0;});}scrim.addEventListener("click",close);side.addEventListener("click",function(e){if(e.target.closest("a")&&window.matchMedia("(max-width:850px)").matches)close()});document.addEventListener("keydown",function(e){if(e.key==="Escape")close()})})();</script>
</body>
</html>
