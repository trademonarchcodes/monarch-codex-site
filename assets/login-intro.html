<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Monarch Codex</title>
<style>
:root{color-scheme:dark;--gold:#dfbd62;--gold-bright:#f6df9b;--bg:#080808}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#211b0d 0,#10100d 24%,var(--bg) 68%);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.intro{width:min(94vw,780px);text-align:center;animation:scene-in .55s ease both}
.mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 25px;border:1px solid #8d743a;border-radius:17px;color:var(--gold-bright);font-size:25px;font-weight:800;box-shadow:0 0 45px #dfbd621c;opacity:0;animation:mark-in .65s .12s cubic-bezier(.2,.8,.2,1) forwards}
.wordmark{display:flex;justify-content:center;flex-wrap:wrap;gap:0 .27em;margin:0;color:#f8f5ec;font-size:clamp(27px,7vw,58px);font-weight:850;letter-spacing:clamp(.07em,1vw,.18em);line-height:1.2}
.word{display:inline-flex;white-space:nowrap}
.letter{display:inline-block;opacity:0;transform:translateY(.7em) rotate(5deg);filter:blur(5px);animation:letter-in .48s cubic-bezier(.18,.75,.25,1) forwards}
.word:nth-child(2){color:var(--gold-bright)}
.rule{width:0;height:1px;margin:24px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:rule-in .6s 1.05s ease forwards}
.tagline{margin:15px 0 0;color:#9c9788;font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;opacity:0;animation:fade-in .45s 1.15s ease forwards}
@keyframes scene-in{from{opacity:0}to{opacity:1}}
@keyframes mark-in{from{opacity:0;transform:translateY(9px) scale(.86)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes letter-in{to{opacity:1;transform:translateY(0) rotate(0);filter:blur(0)}}
@keyframes rule-in{to{width:min(230px,48vw)}}
@keyframes fade-in{to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.letter{opacity:1;transform:none;filter:none}.mark,.tagline{opacity:1}.rule{width:min(230px,48vw)}}
</style>
</head>
<body>
<main class="intro" aria-label="Monarch Codex">
<div class="mark" aria-hidden="true">M</div>
<h1 class="wordmark" aria-label="Monarch Codex"><span class="word" aria-hidden="true" data-word="MONARCH"></span><span class="word" aria-hidden="true" data-word="CODEX"></span></h1>
<div class="rule" aria-hidden="true"></div>
<p class="tagline">Your workspace. Your next move.</p>
</main>
<script>
(function(){
  var words=document.querySelectorAll('[data-word]');
  var delay=240;
  words.forEach(function(word){
    Array.from(word.dataset.word).forEach(function(char){
      var span=document.createElement('span');
      span.className='letter';
      span.textContent=char;
      span.style.animationDelay=delay+'ms';
      word.appendChild(span);
      delay+=65;
    });
    delay+=70;
  });
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var params=new URLSearchParams(window.location.search);
  var next=params.get('next')||'/dashboard';
  // Only allow local paths, preventing open redirects.
  if(!next.startsWith('/')||next.startsWith('//')||next.indexOf('\\')!==-1) next='/dashboard';
  window.setTimeout(function(){window.location.replace(next);},reduced?350:1900);
})();
</script>
</body>
</html>
