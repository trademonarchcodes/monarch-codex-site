:root{color-scheme:dark;--gold:#f3cf3c;--bg:#0b0b0c;--panel:#17171c;--muted:#aaa7a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#292313 0,transparent 42%),#0b0b0c;color:#f7f5ef;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.desk-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;max-width:1600px;margin:auto;padding:22px}.desk-sidebar{position:sticky;top:18px;align-self:start;max-height:calc(100dvh - 36px);overflow:auto;padding:16px 12px;border:1px solid #3e3624;border-radius:20px;background:linear-gradient(180deg,#191817,#101012);box-shadow:0 18px 48px #0004}.desk-brand{display:flex;align-items:center;gap:11px;padding:8px 8px 18px;border-bottom:1px solid #353025;color:#f5d675;font-weight:950;letter-spacing:.1em}.desk-mark{display:grid;place-items:center;width:40px;height:40px;border:1px solid #76602b;border-radius:13px;background:#2a2314;font-size:20px}.desk-brand small{display:block;color:#a9a18d;font-size:9px;letter-spacing:.16em;margin-top:3px}.desk-kicker{margin:20px 8px 8px;color:#8f8878;font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.desk-nav{display:grid;gap:5px}.desk-nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:#d7d2c7;text-decoration:none;font-weight:700}.desk-nav a:hover,.desk-nav a[aria-current=page]{color:#f3cf3c;background:linear-gradient(90deg,#3a3017,#252014)}.desk-nav .nav-icon{width:22px;text-align:center;font-size:18px}.desk-nav .nav-arrow{margin-left:auto;color:#8e815b}.desk-main{min-width:0}.desk-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:18px 22px;border:1px solid #393226;border-radius:17px;background:#141416}.desk-top h1{font-size:clamp(21px,3vw,30px);line-height:1.2;margin:0}.desk-top p{margin:6px 0 0;color:var(--muted);font-size:12px}.desk-role{padding:7px 10px;border:1px solid #514323;border-radius:99px;background:#292315;color:#f0d782;font-size:10px;font-weight:850;letter-spacing:.08em}.desk-content{min-width:0}.ac-panel,.ac-section-card{margin:0 0 18px;padding:clamp(17px,2.5vw,26px);border:1px solid #37332a;border-radius:17px;background:linear-gradient(145deg,#19191d,#121214)}.ac-panel h2{margin:0 0 8px;font-size:20px}.ac-panel p{color:#b9b5aa}.ac-table-wrap{overflow:auto}.ac-table{width:100%;border-collapse:collapse;min-width:580px}.ac-table th,.ac-table td{padding:11px;text-align:left;vertical-align:top;border-bottom:1px solid #34312a}.ac-table th{color:#d9c47d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.ac-panel input,.ac-panel textarea,.ac-panel select{width:100%;padding:11px;border:1px solid #44414a;border-radius:10px;background:#0d0d10;color:#f7f5ef;font:inherit;margin:5px 0 12px}.ac-panel label{display:block;font-size:12px;font-weight:750}.ac-panel .btn,.ac-panel button,.ac-panel .copy-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid #78632d;border-radius:10px;background:#f3cf3c;color:#15120a;font-weight:850;text-decoration:none;cursor:pointer}.ac-tiles,.ac-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ac-tile,.ac-stat{padding:16px;border:1px solid #39352a;border-radius:13px;background:#151518;color:#f7f5ef;text-decoration:none}.ac-tile:hover{border-color:#b69b4e}.ac-tile strong,.ac-tile small{display:block}.ac-tile small,.ac-stat small{margin-top:5px;color:#aaa7a0}.ac-stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0}.ac-stat strong{display:block;font-size:26px;color:#f3cf3c}.ac-overview-hero{display:flex;justify-content:space-between;gap:18px;padding:22px;border:1px solid #514323;border-radius:16px;background:radial-gradient(ellipse at right,#302718,transparent 60%),#171613}.ac-overview-hero h2{font-size:clamp(20px,3vw,29px);max-width:700px}.ac-hero-kicker{color:#f3cf3c!important;font-size:10px;font-weight:900;letter-spacing:.18em}.ac-hero-mark{color:#e9c55d;font-size:48px}.ac-section-head{margin:20px 0 12px}.ac-section-head h2{margin:0}.ac-actions{display:flex;gap:7px;flex-wrap:wrap}.ac-alert,.notice{padding:12px 14px;margin-bottom:14px;border:1px solid #625222;border-radius:11px;background:#27220f;color:#f1dda0}.muted,small{color:#aaa7a0}.ac-tiles form{margin:0}@media(max-width:850px){.desk-layout{grid-template-columns:1fr;padding:12px;gap:12px}.desk-sidebar{position:relative;top:auto;max-height:none;padding:12px}.desk-brand{padding-bottom:12px}.desk-kicker{margin-top:12px}.desk-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.desk-nav a{padding:10px;font-size:12px}.desk-nav .nav-arrow{display:none}.desk-top{padding:16px}.ac-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){.desk-nav{grid-template-columns:1fr 1fr}.desk-nav a{gap:6px;padding:9px 7px}.ac-tiles{grid-template-columns:1fr}.ac-panel{padding:15px}.desk-top h1{font-size:21px}}
